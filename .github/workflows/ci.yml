name: CI

on:
  push:

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked backend dependencies
        run: uv sync --project backend --locked --all-groups

      - name: Check Python syntax
        run: uv run --project backend python -m compileall -q backend/strategies backend/services tests

      - name: Lint strategy and service code
        run: uv run --project backend ruff check --select=E9,F63,F7,F82 backend/strategies backend/services tests

      - name: Static type analysis
        run: uv run --project backend pyright backend/strategies backend/services tests

      - name: Run deterministic unit tests
        run: uv run --project backend python -m pytest -q tests

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build
