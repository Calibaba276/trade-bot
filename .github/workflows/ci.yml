name: CI

on:
  push:

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI tooling
        run: python -m pip install --upgrade pip -r requirements-ci.txt

      - name: Check Python syntax
        run: python -m compileall -q backend/strategies backend/services tests

      - name: Lint strategy and service code
        run: ruff check --select=E9,F63,F7,F82 backend/strategies backend/services tests

      - name: Static type analysis
        run: pyright backend/strategies backend/services tests

      - name: Run deterministic unit tests
        run: python -m pytest -q tests

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build
